<!DOCTYPE html>
<html class="dark" lang="es">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
  <title>AniVault - Gestor de Biblioteca Anime</title>
  
  <!-- Google Fonts: Outfit, Inter, JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet"/>
  
  <!-- Material Symbols Outlined -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"/>
  
  <!-- Supabase JS Client via CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "surface": "#11131c",
            "surface-dim": "#11131c",
            "surface-bright": "#373943",
            "surface-container-lowest": "#0c0e17",
            "surface-container-low": "#191b24",
            "surface-container": "#1d1f29",
            "surface-container-high": "#282933",
            "surface-container-highest": "#32343e",
            "on-surface": "#e1e1ef",
            "on-surface-variant": "#cbc3d7",
            "inverse-surface": "#e1e1ef",
            "inverse-on-surface": "#2e303a",
            "outline": "#958ea0",
            "outline-variant": "#494454",
            "surface-tint": "#d0bcff",
            "primary": "#d0bcff",
            "on-primary": "#3c0091",
            "primary-container": "#a078ff",
            "on-primary-container": "#340080",
            "secondary": "#4cd7f6",
            "on-secondary": "#003640",
            "secondary-container": "#03b5d3",
            "on-secondary-container": "#00424e",
            "tertiary": "#4edea3",
            "on-tertiary": "#003824",
            "tertiary-container": "#00a572",
            "on-tertiary-container": "#00311f",
            "error": "#ffb4ab",
            "on-error": "#690005",
            "error-container": "#93000a",
            "primary-fixed": "#e9ddff",
            "primary-fixed-dim": "#d0bcff",
            "secondary-fixed": "#acedff",
            "secondary-fixed-dim": "#4cd7f6",
            "tertiary-fixed": "#6ffbbe",
            "tertiary-fixed-dim": "#4edea3"
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            display: ['Outfit', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
            'body-md': ['Inter', 'sans-serif'],
            'headline-sm': ['Outfit', 'sans-serif'],
            'headline-md': ['Outfit', 'sans-serif'],
            'headline-lg': ['Outfit', 'sans-serif'],
            'headline-lg-mobile': ['Outfit', 'sans-serif'],
            'title-md': ['Inter', 'sans-serif'],
            'label-sm': ['Inter', 'sans-serif'],
            'label-md': ['Inter', 'sans-serif'],
            'code-sm': ['JetBrains Mono', 'monospace']
          },
          spacing: {
            'gutter-desktop': '1.5rem',
            'space-lg': '1.5rem',
            'space-xl': '2rem',
            'margin-desktop': '2.5rem',
            'margin-tablet': '1.5rem',
            'space-sm': '0.5rem',
            'gutter': '1rem',
            'margin': '1rem',
            'space-md': '1rem',
            'space-xs': '0.25rem',
            'space-2xl': '3rem'
          }
        }
      }
    };
  </script>

  <!-- Custom styles -->
  <link rel="stylesheet" href="css/styles.css"/>
</head>
<body class="bg-surface font-sans text-on-surface antialiased flex flex-col min-h-screen select-none md:select-auto">

  <!-- Fixed Top Header -->
  <header class="fixed top-0 w-full z-50 pt-safe glass-header shadow-[0_1px_12px_rgba(0,0,0,0.4)]">
    <div class="h-16 px-4 md:px-8 max-w-6xl mx-auto flex items-center justify-between gap-3">
      <!-- Brand & Section Label -->
      <a href="#/biblioteca" class="flex items-center gap-2.5 min-w-0 group cursor-pointer">
        <div class="w-8 h-8 rounded-lg bg-primary-container/20 border border-primary/30 flex items-center justify-center text-primary group-hover:scale-105 transition-transform shadow-[0_0_12px_rgba(208,188,255,0.25)]">
          <span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'FILL' 1;">video_library</span>
        </div>
        <div class="flex flex-col">
          <span class="font-display font-bold text-[18px] text-on-surface tracking-tight leading-none group-hover:text-primary transition-colors">AniVault</span>
          <span class="font-sans text-[11px] font-semibold text-on-surface-variant truncate tracking-wide" id="header-section-label">Biblioteca</span>
        </div>
      </a>

      <!-- Quick Status Badges (Supabase + Telegram) -->
      <div class="flex items-center gap-2">
        <!-- Supabase Cloud Sync Status Pill -->
        <button id="header-sync-btn" title="Configurar o ver estado de sincronización" class="flex items-center gap-1.5 bg-surface-container-high/80 hover:bg-surface-container-highest px-3 py-1 rounded-full text-xs transition-all active:scale-95 border border-white/5 shadow-inner">
          <span class="material-symbols-outlined text-[15px] text-tertiary" id="header-sync-icon">cloud_done</span>
          <span class="font-sans text-[11px] font-semibold text-tertiary hidden sm:inline" id="header-sync-text">Supabase Conectado</span>
          <span class="font-sans text-[11px] font-semibold text-tertiary sm:hidden" id="header-sync-text-mobile">Cloud</span>
        </button>

        <!-- Telegram Bot Status Pill -->
        <a href="#/perfil" title="Configuración del Bot de Telegram" class="hidden sm:flex items-center gap-1 bg-surface-container-high/70 hover:bg-surface-container-highest px-2.5 py-1 rounded-full text-xs text-secondary transition-all border border-white/5">
          <span class="material-symbols-outlined text-[15px]">send</span>
          <span class="text-[11px] font-semibold">Bot</span>
        </a>

        <!-- User Profile Avatar Pill -->
        <a href="#/perfil" class="w-8 h-8 rounded-full bg-gradient-to-tr from-primary to-secondary p-0.5 flex items-center justify-center shrink-0 shadow-[0_0_12px_rgba(208,188,255,0.35)] cursor-pointer hover:scale-105 active:scale-95 transition-transform" title="Mi Perfil">
          <div class="w-full h-full rounded-full bg-surface-container overflow-hidden flex items-center justify-center">
            <img id="header-avatar-img" src="" alt="Avatar" class="w-full h-full object-cover hidden"/>
            <span class="material-symbols-outlined text-primary text-[18px]" id="header-avatar-icon">person</span>
          </div>
        </a>
      </div>
    </div>
  </header>

  <!-- Dynamic SPA Main View Container -->
  <main id="app-container" class="flex flex-col flex-1 relative w-full pt-16 pb-24 max-w-6xl mx-auto px-4 md:px-8">
    <div class="flex items-center justify-center h-64 text-outline">
      <div class="flex flex-col items-center gap-3">
        <span class="material-symbols-outlined text-4xl text-primary animate-spin">progress_activity</span>
        <span class="text-sm font-medium">Iniciando Bóveda Anime...</span>
      </div>
    </div>
  </main>

  <!-- Bottom Navigation Bar (Mobile & Desktop Floating) -->
  <nav class="fixed bottom-0 w-full z-40 pb-safe glass-nav shadow-[0_-4px_24px_rgba(0,0,0,0.5)]">
    <div class="flex justify-around items-center h-16 max-w-lg mx-auto px-2">
      <!-- Tab 1: Biblioteca -->
      <a href="#/biblioteca" data-nav="biblioteca" class="nav-tab flex flex-col items-center justify-center min-w-[56px] min-h-[44px] gap-1 transition-all text-primary font-bold">
        <span class="material-symbols-outlined text-[22px]">video_library</span>
        <span class="text-[11px] font-medium tracking-wide">Biblioteca</span>
      </a>

      <!-- Tab 2: Favoritos -->
      <a href="#/favoritos" data-nav="favoritos" class="nav-tab flex flex-col items-center justify-center min-w-[56px] min-h-[44px] gap-1 transition-all text-on-surface-variant hover:text-on-surface">
        <span class="material-symbols-outlined text-[22px]">favorite</span>
        <span class="text-[11px] font-medium tracking-wide">Favoritos</span>
      </a>

      <!-- Tab 3: Añadir (+) -->
      <a href="#/anadir" data-nav="anadir" class="nav-tab flex flex-col items-center justify-center min-w-[56px] min-h-[44px] gap-1 transition-all text-on-surface-variant hover:text-on-surface">
        <div class="w-10 h-10 rounded-full bg-primary hover:bg-primary-container text-on-primary flex items-center justify-center -mt-4 shadow-[0_4px_16px_rgba(160,120,255,0.4)] active:scale-95 transition-all">
          <span class="material-symbols-outlined text-[24px]">add</span>
        </div>
        <span class="text-[11px] font-medium tracking-wide">Añadir</span>
      </a>

      <!-- Tab 4: Perfil -->
      <a href="#/perfil" data-nav="perfil" class="nav-tab flex flex-col items-center justify-center min-w-[56px] min-h-[44px] gap-1 transition-all text-on-surface-variant hover:text-on-surface">
        <span class="material-symbols-outlined text-[22px]">account_circle</span>
        <span class="text-[11px] font-medium tracking-wide">Perfil</span>
      </a>
    </div>
  </nav>

  <!-- Global Modal Container -->
  <div id="modal-container" class="hidden fixed inset-0 z-50 bg-black/75 backdrop-blur-sm flex items-center justify-center p-4"></div>

  <!-- Global Toast Container -->
  <div id="toast-container" class="fixed bottom-20 left-1/2 -translate-x-1/2 z-50 flex flex-col gap-2 pointer-events-none w-full max-w-sm px-4"></div>

  <!-- Universal Scripts: Sin Bloqueo CORS en file:// ni en Servidores HTTP -->
  <script src="js/seedData.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/store.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/views/libraryView.js"></script>
  <script src="js/views/detailView.js"></script>
  <script src="js/views/favoritesView.js"></script>
  <script src="js/views/addView.js"></script>
  <script src="js/views/profileView.js"></script>
  <script src="js/views/loginView.js"></script>
  <script src="js/router.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
